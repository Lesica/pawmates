<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PawMates — шаг 03 [build 2026-04-30-room]</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    /* основные цвета комнаты — менять можно тут одной строкой */
    --wall-color: #F0DEC7;          /* тёплый бежевый — задняя стена */
    --floor-color-light: #B58863;   /* верх пола (ближе) */
    --floor-color-dark:  #8B6443;   /* низ пола (дальше) */
    --window-frame:      #6B4F32;   /* деревянная рама окна */

    /* динамические — меняются JS'ом по времени суток */
    --sky-color:        #87CEEB;
    --time-overlay:     transparent;
  }

  /* ---- общая страница ---- */
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--wall-color);
    font-family: -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 20px 12px 40px;
    gap: 14px;
    transition: background 1s;
  }

  h1 {
    color: #5A3A2A;
    margin: 0;
    font-weight: 600;
    font-size: 20px;
    text-align: center;
  }

  /* ---- КОМНАТА ---- */
  .room {
    position: relative;
    width: 100%;
    max-width: 360px;
    aspect-ratio: 3 / 4;          /* 360x480 пропорция, на телефоне resize'ится */
    background: var(--wall-color);
    border-radius: 14px;
    box-shadow: 0 6px 24px rgba(70, 50, 30, 0.18);
    overflow: hidden;
  }

  /* окно на стене — справа сверху */
  .window {
    position: absolute;
    top: 8%;
    right: 10%;
    width: 30%;
    aspect-ratio: 4 / 5;
    background: var(--sky-color);
    border: 6px solid var(--window-frame);
    border-radius: 4px;
    box-shadow:
      inset 0 0 0 1px rgba(0,0,0,0.1),
      0 2px 6px rgba(70, 50, 30, 0.2);
    transition: background 1s;
    overflow: hidden;
  }
  /* крестовина окна */
  .window::before, .window::after {
    content: '';
    position: absolute;
    background: var(--window-frame);
  }
  .window::before {
    top: 0; bottom: 0;
    left: 50%; width: 4px;
    transform: translateX(-50%);
  }
  .window::after {
    left: 0; right: 0;
    top: 50%; height: 4px;
    transform: translateY(-50%);
  }

  /* декорация в окне (солнце / облако / луна) — меняется по времени */
  .window-decoration {
    position: absolute;
    top: 10%; left: 50%;
    transform: translateX(-50%);
    font-size: 22px;
    z-index: 1;
    pointer-events: none;
    transition: opacity 1s;
  }

  /* подоконник — узкая полоска под окном */
  .windowsill {
    position: absolute;
    top: calc(8% + 30% * 5/4 - 4px); /* под окном; пересчитывается через CSS calc */
    right: calc(10% - 4px);
    width: calc(30% + 8px);
    height: 6px;
    background: var(--window-frame);
    border-radius: 2px;
    box-shadow: 0 2px 4px rgba(70, 50, 30, 0.3);
  }

  /* пол снизу */
  .floor {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 28%;
    background: linear-gradient(180deg, var(--floor-color-light) 0%, var(--floor-color-dark) 100%);
    /* лёгкая текстура досок через повторяющийся градиент */
    background-image:
      repeating-linear-gradient(
        90deg,
        transparent 0,
        transparent 38px,
        rgba(0, 0, 0, 0.08) 38px,
        rgba(0, 0, 0, 0.08) 40px
      ),
      linear-gradient(180deg, var(--floor-color-light) 0%, var(--floor-color-dark) 100%);
  }

  /* плинтус — тонкая линия между стеной и полом */
  .floor::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: rgba(70, 40, 20, 0.4);
  }

  /* ---- кот стоит на полу ---- */
  .cat-stage {
    position: absolute;
    bottom: 8%;                    /* стоит на полу, чуть приподнят */
    left: 50%;
    transform: translateX(-50%);
    width: 78%;
    aspect-ratio: 1 / 1;
    z-index: 2;
  }
  .cat-svg {
    width: 100%;
    height: 100%;
  }

  /* ---- overlay по времени суток (поверх всего) ---- */
  .time-overlay {
    position: absolute;
    inset: 0;
    background: var(--time-overlay);
    pointer-events: none;
    mix-blend-mode: multiply;
    transition: background 1s;
    z-index: 3;
  }

  /* ---- АНИМАЦИИ кота ---- */
  /* idle: правое ухо дёргается (4s цикл) */
  .ear-right {
    transform-origin: 165px 80px;
    animation: ear-twitch 4s ease-in-out infinite;
  }
  /* idle: левое ухо дёргается (6s цикл — намеренно асинхронно) */
  .ear-left {
    transform-origin: 100px 80px;
    animation: ear-twitch 6s ease-in-out infinite;
  }
  @keyframes ear-twitch {
    0%, 90%, 100% { transform: rotate(0deg); }
    93%           { transform: rotate(-8deg); }
    96%           { transform: rotate(4deg); }
  }

  /* idle: тело едва-едва дышит */
  .body-group {
    transform-origin: 130px 200px;
    animation: breathe 3s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1, 1); }
    50%      { transform: scale(1.02, 0.98); }
  }

  /* feeding: хвост машет 4 раза */
  .tail {
    transform-origin: 200px 220px;
    transition: transform 0.2s;
  }
  .feeding .tail {
    animation: tail-wag 0.5s ease-in-out 4;
  }
  @keyframes tail-wag {
    0%, 100% { transform: rotate(0deg); }
    25%      { transform: rotate(20deg); }
    75%      { transform: rotate(-20deg); }
  }

  /* feeding: «мур!» вылезает над котом */
  .speech {
    opacity: 0;
    transform: translateY(0);
    transition: all 0.3s;
  }
  .feeding .speech {
    opacity: 1;
    transform: translateY(-20px);
  }

  /* ---- кнопка ---- */
  .feed-btn {
    background: #E07B95;
    color: white;
    border: none;
    padding: 14px 32px;
    font-size: 18px;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 4px 0 #B05E73;
    transition: all 0.1s;
    font-family: inherit;
  }
  .feed-btn:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #B05E73;
  }
</style>
</head>
<body>

  <h1>Наш тестовый зверь</h1>

  <div class="room">

    <!-- окно (с динамическим небом) -->
    <div class="window">
      <div class="window-decoration">☁️</div>
    </div>
    <div class="windowsill"></div>

    <!-- пол -->
    <div class="floor"></div>

    <!-- кот -->
    <div class="cat-stage">
      <svg class="cat-svg" viewBox="0 0 260 280" xmlns="http://www.w3.org/2000/svg">

        <!-- "мур!" появляется только когда кормишь -->
        <text class="speech" x="130" y="40" text-anchor="middle"
              font-size="22" font-weight="bold" fill="#AFEEEE">МуУурРРр! 💚</text>

        <g class="body-group">

          <!-- хвост (рисуется первым, чтоб был ЗА телом) -->
          <path class="tail"
                d="M 200 220 Q 240 200 235 160 Q 232 140 220 140"
                stroke="#E8A05A" stroke-width="14" fill="none" stroke-linecap="round"/>
          <path class="tail"
                d="M 220 140 Q 218 138 215 138"
                stroke="#F5DCB4" stroke-width="10" fill="none" stroke-linecap="round"/>

          <!-- тело -->
          <ellipse cx="130" cy="200" rx="55" ry="40" fill="#E8A05A"/>
          <!-- брюшко -->
          <ellipse cx="130" cy="215" rx="38" ry="25" fill="#F5DCB4"/>
          <!-- полоски на спине -->
          <path d="M 100 175 Q 130 170 160 175" stroke="#B5732A" stroke-width="3" fill="none"/>
          <path d="M 105 190 Q 130 187 155 190" stroke="#B5732A" stroke-width="3" fill="none"/>

          <!-- лапы -->
          <ellipse cx="105" cy="235" rx="10" ry="8" fill="#E8A05A"/>
          <ellipse cx="155" cy="235" rx="10" ry="8" fill="#E8A05A"/>

          <!-- голова -->
          <circle cx="130" cy="115" r="65" fill="#E8A05A"/>

          <!-- уши -->
          <polygon class="ear-left" points="80,90 70,40 110,70" fill="#E8A05A"/>
          <polygon class="ear-left" points="85,80 80,55 105,72" fill="#FF7F50"/>

          <polygon class="ear-right" points="180,90 190,40 150,70" fill="#E8A05A"/>
          <polygon class="ear-right" points="175,80 180,55 155,72" fill="#F5A8B8"/>

          <!-- M-метка табби на лбу -->
          <path d="M 115 80 L 122 95 L 130 80 L 138 95 L 145 80"
                stroke="#B5732A" stroke-width="2.5" fill="none" stroke-linecap="round"/>

          <!-- мордочка (светлая зона вокруг рта) -->
          <ellipse cx="130" cy="140" rx="32" ry="22" fill="#F5DCB4"/>

          <!-- глаза (миндалевидные, зелёные) -->
          <ellipse cx="108" cy="115" rx="9" ry="11" fill="white"/>
          <ellipse cx="108" cy="115" rx="7" ry="10" fill="#4FA858"/>
          <ellipse cx="108" cy="115" rx="2" ry="9" fill="#1A1A1A"/>
          <circle cx="106" cy="111" r="1.5" fill="white"/>

          <ellipse cx="152" cy="115" rx="9" ry="11" fill="white"/>
          <ellipse cx="152" cy="115" rx="7" ry="10" fill="#4FA858"/>
          <ellipse cx="152" cy="115" rx="2" ry="9" fill="#1A1A1A"/>
          <circle cx="150" cy="111" r="1.5" fill="white"/>

          <!-- нос -->
          <path d="M 125 138 L 130 145 L 135 138 Z" fill="#E07B95"/>

          <!-- рот -->
          <path d="M 130 145 Q 130 152 122 152" stroke="#2A2A2A" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path d="M 130 145 Q 130 152 138 152" stroke="#2A2A2A" stroke-width="2" fill="none" stroke-linecap="round"/>

          <!-- усы -->
          <line x1="98"  y1="142" x2="78"  y2="138" stroke="#2A2A2A" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="98"  y1="148" x2="78"  y2="148" stroke="#2A2A2A" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="98"  y1="154" x2="78"  y2="158" stroke="#2A2A2A" stroke-width="1.5" stroke-linecap="round"/>

          <line x1="162" y1="142" x2="182" y2="138" stroke="#2A2A2A" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="162" y1="148" x2="182" y2="148" stroke="#2A2A2A" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="162" y1="154" x2="182" y2="158" stroke="#2A2A2A" stroke-width="1.5" stroke-linecap="round"/>

        </g>
      </svg>
    </div>

    <!-- overlay по времени суток (поверх всего, чуть подкрашивает сцену) -->
    <div class="time-overlay"></div>
  </div>

  <button class="feed-btn">Покормить</button>

<script>
  // ---- Telegram Mini App init (если открыт в Telegram) ----
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    if (tg.themeParams?.bg_color) {
      document.body.style.background = tg.themeParams.bg_color;
    }
  }

  // ---- ВРЕМЯ СУТОК ----
  // меняет цвет неба в окне + лёгкий overlay поверх всей комнаты,
  // чтобы создать настроение утра/дня/вечера/ночи
  function updateTimeOfDay() {
    const hour = new Date().getHours();
    const root = document.documentElement;
    const decoration = document.querySelector('.window-decoration');

    let sky, overlay, deco;

    if (hour >= 6 && hour < 11) {           // утро
      sky      = '#FFD9A8';                 // мягкий тёплый
      overlay  = 'rgba(255, 220, 170, 0.06)';
      deco     = '☀️';
    } else if (hour >= 11 && hour < 17) {   // день
      sky      = '#87CEEB';                 // ясное голубое
      overlay  = 'transparent';
      deco     = '☁️';
    } else if (hour >= 17 && hour < 20) {   // вечер
      sky      = '#FF8C6E';                 // оранжево-розовый закат
      overlay  = 'rgba(255, 130, 90, 0.10)';
      deco     = '🌅';
    } else if (hour >= 20 && hour < 22) {   // сумерки
      sky      = '#3D5A80';                 // тёмно-синий
      overlay  = 'rgba(40, 50, 90, 0.18)';
      deco     = '🌆';
    } else {                                 // ночь (22-5)
      sky      = '#1B2D4F';                 // глубокий ночной
      overlay  = 'rgba(15, 25, 55, 0.30)';
      deco     = '🌙';
    }

    root.style.setProperty('--sky-color', sky);
    root.style.setProperty('--time-overlay', overlay);
    decoration.textContent = deco;
  }

  updateTimeOfDay();
  setInterval(updateTimeOfDay, 60_000);   // обновлять раз в минуту

  // ---- логика кнопки "Покормить" ----
  const stage = document.querySelector('.cat-stage');
  const btn   = document.querySelector('.feed-btn');

  btn.addEventListener('click', () => {
    stage.classList.add('feeding');
    setTimeout(() => stage.classList.remove('feeding'), 2500);
    if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
  });
</script>

</body>
</html>
